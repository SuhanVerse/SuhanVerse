  <marker id="signal-arrow" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto"><path d="M1 1 5.7 3.5 1 6" fill="none" stroke="#8b949e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker>
