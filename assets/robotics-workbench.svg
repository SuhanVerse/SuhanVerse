    <path d="m163 81 35-22 15 11-35 23Z" fill="#102f45" stroke="#58a6ff" stroke-width="1.7"/>
    <g fill="#0d1117" stroke="#8bcbff" stroke-width="1.7"><ellipse cx="177" cy="78" rx="8" ry="11" transform="rotate(32 177 78)"/><ellipse cx="196" cy="66" rx="8" ry="11" transform="rotate(32 196 66)"/></g>
