    <g fill="#58a6ff"><circle cx="24" cy="9" r="2"/><circle cx="163" cy="9" r="2"/><circle cx="24" cy="64" r="2"/><circle cx="163" cy="64" r="2"/></g>
    <path d="M79 73v14M89 73v14M99 73v14M109 73v14" stroke="#e5b876" stroke-width="4"/>
    <rect x="74" y="70" width="40" height="8" rx="1" fill="#263344"/>
  </g>
  <g id="controller" stroke-linecap="round" stroke-linejoin="round">
