<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title description">
<title id="title">Sense, Code, Move — conceptual robotics workbench</title>
<desc id="description">An original engineering illustration shows a cyan dual ultrasonic sensor connected to a green controller board and an amber-accented four-wheel rover. Sense, Code and Move label the conceptual flow from sensors through firmware to motors and wheels. This is a conceptual illustration, not a photograph or a device schematic.</desc>
<defs>
