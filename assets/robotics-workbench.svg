    <path d="M9 21Q-3 36 9 51M-2 14Q-21 36-2 58M178 21Q190 36 178 51M189 14Q208 36 189 58" fill="none" stroke="#58a6ff" stroke-width="2" opacity=".7"/>
    <rect x="15" y="0" width="157" height="73" rx="7" fill="#11263b" stroke="#58a6ff" stroke-width="2"/>
    <path d="M26 11h136M26 62h136" fill="none" stroke="#284966"/>
